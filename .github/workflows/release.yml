name: release
on:
  push:
    tags:
      - "swiftcraft--v*"
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag matches the plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#swiftcraft--v}"
          FILE_VERSION="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match plugin.json $FILE_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
      - name: Build release notes from CHANGELOG
        run: node scripts/changelog-notes.js "$VERSION" > notes.md
      - name: Build the source archive and its checksum
        run: |
          git archive --format=tar.gz --prefix="swiftcraft-${VERSION}/" -o "swiftcraft-${VERSION}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "swiftcraft-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: swiftcraft-${{ env.VERSION }}.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "swiftcraft $VERSION" --notes-file notes.md $FLAGS "swiftcraft-${VERSION}.tar.gz" SHA256SUMS
